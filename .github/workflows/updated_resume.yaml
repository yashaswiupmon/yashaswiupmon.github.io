name: Update site data from resume

on:
  push:
    paths: ["resume.pdf"]      # runs whenever you upload a new resume.pdf
  workflow_dispatch:           # also lets you run it by hand from the Actions tab

permissions:
  contents: write              # to commit the updated resume.json
  pages: write                 # to ask GitHub Pages to rebuild

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdfium2 pypdf
      - run: python scripts/build_resume.py resume.pdf resume.json
      - name: Commit and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.json
          if git diff --staged --quiet; then
            echo "resume.json already up to date"
          else
            git commit -m "Update resume.json from resume.pdf"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds"
          fi
