name: Build and deploy resume site

on:
  push:
    paths-ignore:
      - "resume.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdfium2 pypdf
      - run: python scripts/build_resume.py resume.pdf resume.json
      - name: Save updated resume data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.json
          if git diff --cached --quiet; then
            echo "resume.json already up to date"
          else
            git commit -m "Update resume.json from resume.pdf"
            git push
          fi
      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp index.html resume.json resume.pdf _site/
          cp -R images _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4