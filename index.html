<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yashaswi Upmon – Platform Engineer</title>
<meta name="description" content="Platform engineer building cloud infrastructure and delivery pipelines at State Street, Bangalore.">
<style>
  :root {
    --bg: #f3f6f9; --surface: #fff; --ink: #14213d; --muted: #4d5b73; --line: #d3dbe4;
    --accent: #0b6e79; --hero: #0f2a43; --hero-ink: #fff; --hero-soft: #b9c9dc; --bar: #dfe7ee;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1626; --surface: #14233a; --ink: #e8eef6; --muted: #a4b2c6; --line: #2b3d57;
      --accent: #5cc4cf; --hero: #0a1424; --bar: #2b3d57;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 4rem; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.65 var(--sans); }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 56rem; margin: 0 auto; padding: 0 1.25rem; }

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: var(--hero); }
  nav .wrap { display: flex; gap: 1.4rem; overflow-x: auto; white-space: nowrap; padding-top: .9rem; padding-bottom: .9rem; }
  nav a { color: var(--hero-soft); text-decoration: none; font-size: .95rem; font-weight: 600; }
  nav a:hover { color: var(--hero-ink); }

  .hero { background: var(--hero); color: var(--hero-ink); text-align: center; padding: 7rem 1.25rem 4rem; }
  .photo { width: 9.5rem; height: 9.5rem; border-radius: 50%; margin: 0 auto 1.5rem; border: 4px solid var(--hero-soft);
    background: #1c4160 center/cover; display: grid; place-items: center; font: 700 2.6rem var(--serif); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { font: 700 clamp(2.4rem,7vw,3.8rem)/1.05 var(--serif); letter-spacing: -.02em; margin: 0 0 .75rem; }
  .tag { font: 1.25rem/1.45 var(--serif); color: var(--hero-soft); max-width: 34rem; margin: 0 auto 1.75rem; }
  .btn { display: inline-block; padding: .7rem 1.3rem; border-radius: 6px; font-weight: 700; text-decoration: none;
    background: var(--hero-ink); color: var(--hero); }
  .social { display: flex; justify-content: center; gap: 1.25rem; margin-top: 1.5rem; }
  .social a { color: var(--hero-ink); font-weight: 600; }

  section { padding: 3rem 0; border-bottom: 1px solid var(--line); }
  h2 { font: 700 1.8rem/1.2 var(--serif); margin: 0 0 1.5rem; }
  p { margin: 0 0 1rem; max-width: 42rem; }

  .info { display: grid; grid-template-columns: repeat(auto-fit,minmax(14rem,1fr)); gap: 1rem 2rem; margin-top: 1.5rem; }
  .info b { display: block; }
  .info span { color: var(--muted); }

  .skills { display: grid; grid-template-columns: repeat(auto-fit,minmax(18rem,1fr)); gap: 1.1rem 3rem; }
  .skill { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: .3rem; }
  .skill small { color: var(--muted); font-weight: 400; }
  .bar { height: 8px; border-radius: 4px; background: var(--bar); }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); width: var(--w); }

  .grp { margin: 0 0 .4rem; font: 700 1rem var(--sans); }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chips span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .15rem .75rem; font-size: .92rem; }
  .pub-venue { color: var(--muted); font-size: .95rem; }
  .pub-desc { color: var(--muted); font-size: .98rem; margin: .2rem 0 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit,minmax(16rem,1fr)); gap: 1.25rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; }
  .card h3 { margin: 0 0 .5rem; font: 700 1.15rem var(--serif); }
  .card p { color: var(--muted); font-size: .98rem; margin-bottom: .75rem; }

  .job { display: grid; grid-template-columns: 11rem 1fr; gap: .5rem 2rem; margin-bottom: 2.25rem; }
  .when { color: var(--muted); font-weight: 600; }
  .job h3 { margin: 0; font: 700 1.2rem var(--serif); }
  .job .where { color: var(--muted); margin-bottom: .6rem; }
  .job ul, ul.plain { margin: 0; padding-left: 1.2rem; }
  .job li, .plain li { margin-bottom: .45rem; }
  @media (max-width: 40rem) { .job { grid-template-columns: 1fr; } }

  footer { padding: 2rem 0 3rem; text-align: center; color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>

<nav aria-label="Sections"><div class="wrap">
  <a href="#about">About</a><a href="#skills">Skills</a><a href="#projects">Projects</a>
  <a href="#experience">Experience</a><a href="#publications">Publications</a><a href="#certifications">Certifications</a><a href="#education">Education</a>
</div></nav>

<header class="hero">
  <div class="photo" id="photo"></div>
  <h1 id="name">Loading…</h1>
  <p class="tag" id="tagline"></p>
  <a class="btn" id="resume" href="resume.pdf">View my resume</a>
  <div class="social" id="links"></div>
</header>

<main class="wrap">
  <noscript><p>This page needs JavaScript to show its content.</p></noscript>
  <p id="err" hidden>Couldn’t load resume.json. Check that it is in the same folder as index.html and is valid JSON.</p>
  <section id="about"><h2>About</h2><div id="about-text"></div><div class="info" id="info"></div></section>
  <section id="skills"><h2>Skills</h2><div class="skills" id="skills-list"></div></section>
  <section id="projects"><h2>Projects</h2><div class="cards" id="projects-list"></div></section>
  <section id="experience"><h2>Work Experience</h2><div id="work-list"></div></section>
  <section id="publications"><h2>Research Publications</h2><ul class="plain" id="pubs-list"></ul></section>
  <section id="certifications"><h2>Certifications &amp; awards</h2><ul class="plain" id="certs-list"></ul></section>
  <section id="education" style="border-bottom:0"><h2>Education</h2><div id="edu-list"></div></section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<script>
// Builds the whole page from resume.json, so you only ever edit that one file.
const $ = id => document.getElementById(id);
const safe = u => /^(https?:|mailto:)/.test(u || "") ? u : "";
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in props || {}) k === "class" ? e.className = props[k] : e.setAttribute(k, props[k]);
  kids.flat().forEach(k => { if (k != null && k !== "") e.append(k.nodeType ? k : document.createTextNode(k)); });
  return e;
}
const link = (text, url) => safe(url) ? h("a", { href: url }, text) : null;

fetch("resume.json?v=" + Date.now(), { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    document.title = d.name + " – Platform Engineer";
    $("name").textContent = d.name;
    $("tagline").textContent = d.tagline || "";
    $("resume").href = d.resumeFile || "resume.pdf";
    const initials = d.name.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
    const img = h("img", { src: d.photo || "", alt: "Portrait of " + d.name });
    img.onerror = () => img.remove();
    $("photo").append(img, initials);
    (d.links || []).forEach(l => $("links").append(link(l.label, l.url) || ""));

    (d.about || []).forEach(t => $("about-text").append(h("p", {}, t)));
    (d.info || []).forEach(i => $("info").append(h("div", {}, h("b", {}, i.label), h("span", {}, i.value))));

    (d.skills || []).forEach(g => $("skills-list").append(
      h("div", {}, h("h3", { class: "grp" }, g.group), h("div", { class: "chips" }, (g.items || []).map(i => h("span", {}, i))))));

    (d.projects || []).forEach(p => $("projects-list").append(
      h("div", { class: "card" }, h("h3", {}, p.title), h("p", {}, p.description), link("View project", p.url))));

    (d.work || []).forEach(w => $("work-list").append(h("div", { class: "job" },
      h("div", { class: "when" }, w.dates),
      h("div", {}, h("h3", {}, w.title), h("div", { class: "where" }, w.company),
        h("ul", {}, (w.bullets || []).map(b => h("li", {}, b)))))));

    (d.publications || []).forEach(p => $("pubs-list").append(
      h("li", {}, link(p.citation, p.url) || p.citation, " ", h("span", { class: "pub-venue" }, p.venue ? "· " + p.venue : ""),
        p.description ? h("p", { class: "pub-desc" }, p.description) : "")));

    (d.certifications || []).forEach(c => $("certs-list").append(h("li", {}, link(c.name, c.url) || c.name)));
    (d.awards || []).forEach(a => $("certs-list").append(h("li", {}, a)));

    // Hide any section whose list is empty in resume.json
    const hide = id => { $(id).remove(); const n = document.querySelector('nav a[href="#' + id + '"]'); if (n) n.remove(); };
    if (!(d.projects || []).length) hide("projects");
    if (!(d.certifications || []).length && !(d.awards || []).length) hide("certifications");

    (d.education || []).forEach(e => $("edu-list").append(h("div", { class: "job" },
      h("div", { class: "when" }, e.dates),
      h("div", {}, h("h3", {}, e.title), h("div", { class: "where" }, e.school)))));

    $("foot").textContent = "© " + new Date().getFullYear() + " " + d.name;
  })
  .catch(() => { $("err").hidden = false; });
</script>
</body>
</html>
